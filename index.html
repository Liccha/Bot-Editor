html,body{height:100%}
body{font-family:'Microsoft YaHei',sans-serif;background:#f5f6fa url('bg.png') center/cover fixed}

		function loadFont(name){if(_loadedFonts[name]||name==="默认")return;_loadedFonts[name]=true;var f=_dsFonts.find(function(x){return x.name===name});if(!f)return;var s=document.createElement("style");s.textContent="@font-face{font-family:'"+name+"';src:url('"+API_BASE+"/api/fonts/file?"+f.file+"') format('"+(f.file.endsWith(".ttf")?"truetype":"opentype")+"')}";document.head.appendChild(s)}
		var _origBP=buildProps;buildProps=function(){_origBP();if(_dsSel&&_dsSel!=="cover"&&!_dsSel.startsWith("shape_")&&_dsSel!=="tags"){var fn=getVal("_ds."+_dsSel+".font");if(fn&&fn!=="默认")loadFont(fn)}if(_dsSel==="tags"){var tfn=getVal("_ds.tags.tagFont");if(tfn&&tfn!=="默认")loadFont(tfn)}};

		function dsToast(msg){var t=document.getElementById("dsToast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}

		document.getElementById("dsSave").addEventListener("click",function(){
			if(_dsSaving)return;_dsSaving=true;
			var btn=this;btn.disabled=true;btn.textContent="保存中...";
			var css="";
			css+=".lib-card{position:relative;background:"+_ds.card.bg+";border-radius:"+_ds.card.brTL+"px "+_ds.card.brTR+"px "+_ds.card.brBR+"px "+_ds.card.brBL+"px;border:1px solid #e2e8f0;padding:0;display:block;cursor:pointer;transition:all .15s;min-height:"+_ds.card.h+"px}\n";
			css+=".lib-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}\n";
			css+=".lib-grid{gap:"+_ds.card.gap+"px}\n";
			// Cover - always output, use display to hide
			css+=".lib-card .cv{position:absolute;left:"+_ds.cover.x+"px;top:"+_ds.cover.y+"px;width:"+_ds.cover.w+"px;height:"+_ds.cover.h+"px;object-fit:cover;border-radius:"+_ds.cover.radius+"%;border:"+_ds.cover.ringW+"px solid "+_ds.cover.ringColor+";box-shadow:"+_ds.cover.shadow+";flex-shrink:0"+(typeof _ds.cover.visible==="boolean"&&!_ds.cover.visible?";display:none":"")+"}\n";
			// Text elements - always output, hidden ones get display:none
			["name","artist","bpm","duration","charters","tags"].forEach(function(t){
				var cls=t.substring(0,2);var f=_ds[t].font==="默认"?"inherit":"'"+_ds[t].font+"'";
				css+=".lib-card ."+cls+"{position:absolute;left:"+_ds[t].x+"px;top:"+_ds[t].y+"px;font-family:"+f+";font-size:"+_ds[t].size+"px;color:"+_ds[t].color+";font-weight:"+(_ds[t].weight||"normal")+";white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
				if(t==="tags")css+=";background:"+(_ds[t].bg||"#dbeafe")+";padding:1px 6px;border-radius:4px";
				if(_ds[t].visible===false)css+=";display:none";
				css+="}\n";
			});
			// Tag badge fonts
			var tf=_ds.tags.tagFont==="默认"?"inherit":"'"+_ds.tags.tagFont+"'";
			css+=".lib-card .ta span{font-family:"+tf+";font-size:"+_ds.tags.tagSize+"px;color:"+_ds.tags.tagColor+"}\n";
			// Shapes
			(_ds.shapes||[]).forEach(function(sh,i){
				css+=".lib-card .sh"+i+"{position:absolute;left:"+sh.x+"px;top:"+sh.y+"px;width:"+sh.w+"px;height:"+sh.h+"px;background:"+(sh.color||"#e2e8f0")+";opacity:"+(sh.opacity||1)+";z-index:"+(sh.zIndex||0);
				if(sh.type==="circle")css+=";border-radius:50%";else if(sh.radius)css+=";border-radius:"+sh.radius+"px";
				css+="}\n";
			});
			fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({css:css,maxWidth:_ds.card.w+40,config:JSON.stringify({shapes:_ds.shapes,name:{prefix:_ds.name.prefix,suffix:_ds.name.suffix},artist:{prefix:_ds.artist.prefix,suffix:_ds.artist.suffix},bpm:{prefix:_ds.bpm.prefix,suffix:_ds.bpm.suffix},duration:{prefix:_ds.duration.prefix,suffix:_ds.duration.suffix},charters:{prefix:_ds.charters.prefix,suffix:_ds.charters.suffix}})})}).then(function(r){
				if(r.ok){dsToast("已注入! 刷新曲库页查看效果")}else{dsToast("保存失败")}
				btn.disabled=false;btn.textContent="注入保存";_dsSaving=false;
			}).catch(function(){dsToast("保存失败");btn.disabled=false;btn.textContent="注入保存";_dsSaving=false});
		});

		document.getElementById("dsReset").addEventListener("click",function(){location.reload()});
		document.querySelector('[data-tab="design"]').addEventListener("click",function(){buildPreview();buildElList();buildProps()});
	})();


})();
</script>
<script id="dsConfig" type="application/json">{}</script>
</body>
</html>
