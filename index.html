<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot 工作站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
html,body{height:100%}
body{font-family:'Microsoft YaHei',sans-serif;background:#f5f6fa url('bg.png') center/cover fixed}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;gap:0}
.tab-bar button{padding:12px 24px;border:none;background:none;font-size:14px;font-family:inherit;cursor:pointer;color:#64748b;border-bottom:2px solid transparent;transition:all .15s}
.tab-bar button:hover{color:#1e293b}
.tab-bar button.active{color:#3b82f6;border-bottom-color:#3b82f6;font-weight:600}
.tab-content{display:none;height:calc(100% - 49px);overflow-y:auto}
.tab-content.active{display:flex;flex-direction:column}
/* --- 公告编辑器样式 --- */
.a-app{width:100%;max-width:960px;display:flex;flex-direction:column;min-height:100%;padding:24px 20px;margin:0 auto}
.a-app h1{text-align:center;color:#1e293b;font-size:22px;margin-bottom:20px;letter-spacing:1px}
.a-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;flex:1}
.a-card{background:rgba(255,255,255,0.75);border-radius:14px;border:1px solid #e1e4eb;padding:12px 10px;text-align:center;cursor:pointer;transition:all .15s;min-height:155px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.a-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
.a-card .grp{font-weight:700;font-size:13px;color:#1e293b;margin-bottom:4px}
.a-card .tm{font-size:11px;color:#64748b;margin-bottom:2px}
.a-card .st{font-size:11px;margin-bottom:4px}
.a-card .st.sent{color:#16a34a;font-weight:600}
.a-card .st.pending{color:#d97706;font-weight:600}
.a-card .cnt{font-size:11px;color:#475569;line-height:1.4;word-break:break-all;max-height:50px;overflow:hidden}
.a-card .del{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;border:none;background:#f1f5f9;color:#94a3b8;cursor:pointer;font-size:14px;line-height:20px;display:none;transition:all .15s}
.a-card:hover .del{display:block}
.a-card .del:hover{background:#fecaca;color:#dc2626}
.a-card.add{border:2px dashed #cbd5e1;background:#f8fafc}
.a-card.add:hover{background:#e2e8f0;border-color:#94a3b8}
.a-card.add .plus{font-size:36px;color:#94a3b8;font-weight:200}
.a-card-ghost{visibility:hidden}
.a-pager{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 0 8px}
.a-pager button{padding:7px 22px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1e293b;cursor:pointer;font-size:13px;font-family:inherit}
.a-pager button:disabled{opacity:.35;cursor:default}
.a-pager span{font-size:13px;color:#64748b}
/* --- Shared --- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border-radius:10px;border:none;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.btn.primary{background:#3b82f6;color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.3)}
.btn.primary:hover{background:#2563eb}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.secondary{background:#fff;color:#475569;border:1px solid #cbd5e1}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.4);z-index:1000;justify-content:center;align-items:flex-start;padding-top:32px;overflow-y:auto}
.overlay.show{display:flex}
.dialog{background:#fff;border-radius:18px;padding:24px 28px;width:540px;max-width:96vw;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.dialog h2{font-size:17px;color:#1e293b;margin-bottom:18px;font-weight:700}
.sec{margin-bottom:15px}
.sec label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:6px}
.sec textarea{width:100%;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;min-height:200px;outline:none}
.sec textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.sec input[type=text]{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.sec .gid-wrap{display:flex}.sec .gid-wrap input{flex:1;border-radius:10px 0 0 10px}
.sec .gid-wrap .dd-btn{width:36px;background:#fff;border:1px solid #cbd5e1;border-left:none;border-radius:0 10px 10px 0;cursor:pointer;font-size:12px;color:#64748b;display:flex;align-items:center;justify-content:center}
.dd-menu{display:none;position:absolute;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:2000;min-width:210px}
.dd-menu.show{display:block}
.dd-menu .dd-item{padding:9px 16px;font-size:13px;cursor:pointer;color:#1e293b;border-bottom:1px solid #f1f5f9}
.dd-menu .dd-item:hover{background:#eff6ff}
.file-zone{border:2px dashed #cbd5e1;border-radius:10px;padding:42px 14px;text-align:center;color:#94a3b8;font-size:12px;cursor:pointer}
.file-zone:hover,.file-zone.drag{border-color:#3b82f6;color:#3b82f6;background:#eff6ff}
.attach-list{list-style:none;margin-top:8px}.attach-list li{font-size:12px;color:#475569;padding:3px 0;cursor:pointer}
.attach-list li:hover{color:#ef4444}.attach-list li:after{content:' ×';color:#94a3b8;font-size:10px}
.chk-row{display:flex;gap:24px}.chk-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:#1e293b;cursor:pointer}
.calendar{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);padding:16px;z-index:3000;width:290px;border:1px solid #e2e8f0}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-nav button{border:none;background:#f1f5f9;cursor:pointer;font-size:13px;color:#475569;padding:3px 10px;border-radius:6px}
.cal-nav span{font-size:14px;font-weight:700;color:#1e293b}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .wh{font-size:10px;color:#94a3b8;padding:5px 0;font-weight:600}
.cal-grid .wh.wk{color:#ef4444}
.cal-grid .day{font-size:13px;padding:7px 0;border-radius:7px;cursor:pointer;color:#334155}
.cal-grid .day:hover{background:#eff6ff}
.cal-grid .day.off{color:#cbd5e1;pointer-events:none}
.cal-grid .day.today{background:#dbeafe;color:#1e40af;font-weight:600}
.cal-grid .day.sel{background:#3b82f6;color:#fff;font-weight:600}
.cal-time{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:13px;color:#475569}
.btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-row .btn{padding:8px 24px;border-radius:10px;border:none;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600}
.tpl-capsule{display:inline-block;padding:3px 12px;border-radius:12px;font-size:11px;cursor:pointer;border:1px solid #cbd5e1;background:#f8fafc;color:#475569;transition:all .15s}
.tpl-capsule:hover{background:#3b82f6;color:#fff;border-color:#3b82f6}
.tpl-capsule.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
#libFilters .tpl-capsule{width:110px;height:42px;overflow:hidden;box-sizing:border-box;border:none;border-radius:50px;font-family:'方正粗圆简体','Microsoft YaHei',sans-serif;font-size:16px;font-weight:600;letter-spacing:.5px;background:rgba(255,255,255,0.7);color:#64748b;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(203,213,225,0.6),0 1px 3px rgba(0,0,0,0.04);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#libFilters .tpl-capsule:hover{color:#1e293b;background:#fff;transform:translateY(-1px);box-shadow:inset 0 0 0 1px rgba(203,213,225,0.6),0 4px 12px rgba(0,0,0,0.1)}
#libFilters .tpl-capsule.active{color:#fff;background:linear-gradient(135deg,#3b82f6,#60a5fa);box-shadow:0 4px 14px rgba(59,130,246,0.4),inset 0 1px 0 rgba(255,255,255,0.3);transform:translateY(-1px)}
#libFilters .tpl-capsule.active:hover{background:linear-gradient(135deg,#2563eb,#3b82f6);box-shadow:0 6px 18px rgba(59,130,246,0.5),inset 0 1px 0 rgba(255,255,255,0.3)}
.lib-tip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:transparent;border:1.5px solid #94a3b8;color:#94a3b8;cursor:pointer;font-size:11px;font-weight:bold;flex-shrink:0;transition:all .2s;user-select:none;line-height:1}
.lib-tip:hover{border-color:#3b82f6;color:#3b82f6;transform:scale(1.15)}
@media(max-width:768px){
#libToolbar{flex-direction:column!important;align-items:center!important;gap:10px!important}
#libSearchWrap{order:1;width:100%;justify-content:center;max-width:320px}
#libSearchWrap #libSearch{max-width:100%!important;flex:1}
#libToolbarSpacer{display:none}
#libFilters{order:2;justify-content:center;width:100%;gap:4px!important}
#libFilters .tpl-capsule{width:60px!important;height:33px!important;font-size:14px!important;border-radius:30px!important}
#libFilters .tpl-capsule .ct{transform:scaleX(1)!important}
}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 28px;border-radius:24px;font-size:13px;z-index:4000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:900px){.a-grid{grid-template-columns:repeat(4,1fr)}.a-card{min-height:140px}}
@media(max-width:700px){.a-grid{grid-template-columns:repeat(3,1fr)}.a-card{min-height:130px}}
@media(max-width:480px){.a-grid{grid-template-columns:repeat(2,1fr);gap:8px}.a-card{min-height:120px;padding:8px 6px}.a-card .grp{font-size:12px}.a-card .cnt{font-size:10px}.cal-grid .day{font-size:11px;padding:5px 0}}

/* --- 曲库查询 --- */
.lib-search{width:100%;max-width:740px;padding:10px 16px;border:2px solid #cbd5e1;border-radius:12px;font-size:14px;font-family:inherit;outline:none;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto}
.lib-search:focus{border-color:#3b82f6}
.lib-grid{display:flex;flex-direction:column;gap:8px}
.lib-card{position:relative;background:rgba(255,255,255,0.85);border-radius:60px 12px 60px 60px;border:1px solid #e2e8f0;padding:0;display:block;cursor:pointer;transition:all .15s;min-height:110px}
.lib-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.lib-grid{gap:20px}@media(max-width:768px){.lib-grid{gap:80px}}.lib-card .cv{position:absolute;left:-19px;top:-6px;width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid #317ad8;box-shadow:0 0 0 2px rgba(59,130,246,.15);flex-shrink:0;background:#fff}
.lib-card .na{position:absolute;left:118px;top:6px;font-family:'演示斜黑体';font-size:21px;color:#1e293b;line-height:1.4;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:clip}
.lib-card .ar{position:absolute;left:118px;top:41px;font-family:'演示斜黑体';font-size:13px;color:#27292b;line-height:1.4;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip}
.lib-card .bp{position:absolute;left:111px;top:85px;font-family:'方正粗圆简体';font-size:14px;color:#ffffff;line-height:1.4;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip}
.lib-card .du{position:absolute;left:197px;top:85px;font-family:'方正粗圆简体';font-size:14px;color:#ffffff;line-height:1.4;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip}
.lib-card .ch{position:absolute;left:250px;top:55px;font-family:'方正粗圆简体';font-size:10px;color:#ffffff;line-height:1.4;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip;display:none}
.lib-card .ta{position:absolute;left:238px;top:84px;font-family:inherit;font-size:14px;color:#1e40af;line-height:1.4;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:clip;display:flex;gap:5px;flex-wrap:wrap;background:transparent;padding:0;overflow:visible;white-space:normal;display:none}
.lib-card .ta span{font-family:'方正粗圆简体';font-size:13px;color:#1e40af}
.lib-card .sh0{position:absolute;left:-9px;top:78px;width:80000px;height:32px;background:#2c3030;opacity:1;z-index:0}
.lib-card .sh1{position:absolute;left:4px;top:-3px;width:88888px;height:80px;background:#edfafd;opacity:1;z-index:0}
.lib-card .heart{position:absolute;right:16px;left:auto;top:10px;z-index:5;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:26px;--heart-color:#cbd5e1;color:var(--heart-color)}
.lib-detail{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.5);z-index:1000;justify-content:center;align-items:flex-start;padding-top:32px;overflow-y:auto}
.lib-detail.show{display:flex}
.ld-diffs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ld-mode{margin-bottom:10px}
.ld-close{margin-top:14px;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:rgba(255,255,255,0.6);cursor:pointer;font-size:13px;font-family:inherit;color:#475569}
.ld-close:hover{background:rgba(255,255,255,0.9)}
.lib-detail .dd{background:#ffffff;border-radius:0px;padding:24px;width:500px;max-width:96vw;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative;z-index:0;overflow:hidden;transition:background .4s}
.ld-blur-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(5px) brightness(0.65);opacity:0.35;z-index:-1;pointer-events:none;border-radius:5px}.ld-blur-bg::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,0.7)}
.ld-header{position:relative;height:120px;margin-bottom:16px}
.ld-cover{position:absolute;left:-5px;top:-7px;width:120px;height:120px;border-radius:0px;object-fit:cover;background:#f1f5f9}
.ld-name{position:absolute;left:131px;top:-4px;right:0;font-family:inherit;font-size:16px;color:#1e293b;font-weight:700;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ld-artist{position:absolute;left:131px;top:29px;right:0;font-family:inherit;font-size:13px;color:#475569;overflow:hidden;white-space:nowrap}
.ld-charter{position:absolute;left:131px;top:95px;right:0;font-family:inherit;font-size:12px;color:#94a3b8;overflow:hidden;white-space:nowrap}
.ld-mode-tag{font-family:'方正粗圆简体';font-size:13px;font-weight:700;padding:2px 8px;border-radius:9px;display:inline-block;margin-bottom:5px}
.ld-tag-4k{background:#14a5ff;color:#ffffff}
.ld-tag-5k{background:#ea2e89;color:#ffffff}
.ld-tag-6k{background:#e53be8;color:#ffffff}
.ld-tag-catch{background:#ff811a;color:#ffebf3}
.ld-diff{font-family:'方正粗圆简体';font-size:12px;font-weight:700;padding:3px 12px;border-radius:100px;white-space:nowrap}
.ld-easy{background:#e6fae6;color:#006400}
.ld-normal{background:#fffad2;color:#826400}
.ld-hard{background:#ffe1e1;color:#b40000}
.ld-master,.ld-catch{background:linear-gradient(90deg,#ffd7d7,#fff5c3,#d7ffd7,#d7f5ff,#ebd7ff);color:#503264}

.lib-stats{text-align:center;color:#64748b;font-size:13px;margin-bottom:12px}
/* --- 卡片设计器 --- */
.ds-workspace{display:flex;height:100%}
.ds-canvas{flex:1;background:#e2e8f0;position:relative;overflow:auto;min-height:500px}
.ds-canvas-bg{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px}
.ds-card-preview{position:relative;background:rgba(255,255,255,0.85);box-shadow:0 4px 20px rgba(0,0,0,.12);border:1px solid #e2e8f0;cursor:default;user-select:none}
.ds-el{position:absolute;cursor:move;white-space:nowrap;overflow:hidden;min-width:8px;min-height:8px}
.ds-el.selected{outline:2px dashed #3b82f6;outline-offset:2px;z-index:5}
.ds-el-cover{position:absolute;cursor:move;overflow:visible}
.ds-el-cover img{display:block;width:100%;height:100%;object-fit:cover}
.ds-el-cover.selected{outline:2px dashed #f59e0b;outline-offset:2px;z-index:5}
.ds-resize-handle{position:absolute;width:8px;height:8px;background:#3b82f6;border:1.5px solid #fff;z-index:20;display:none}
.selected .ds-resize-handle,.ds-el-cover.selected .ds-resize-handle{display:block}
.ds-resize-handle.nw{top:-4px;left:-4px;cursor:nw-resize}
.ds-resize-handle.ne{top:-4px;right:-4px;cursor:ne-resize}
.ds-resize-handle.sw{bottom:-4px;left:-4px;cursor:sw-resize}
.ds-resize-handle.se{bottom:-4px;right:-4px;cursor:se-resize}
.ds-corner-handle{position:absolute;width:10px;height:10px;background:#10b981;border:2px solid #fff;border-radius:50%;z-index:15;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ds-corner-handle:hover{background:#059669;transform:scale(1.2)}
.ds-corner-handle:nth-child(1){top:-5px;left:-5px}
.ds-corner-handle:nth-child(2){top:-5px;right:-5px}
.ds-corner-handle:nth-child(3){bottom:-5px;left:-5px}
.ds-corner-handle:nth-child(4){bottom:-5px;right:-5px}
.ds-panel2{width:280px;background:#fff;border-left:1px solid #e2e8f0;overflow-y:auto;font-size:12px}
.ds-panel2 h3{font-size:13px;color:#1e293b;font-weight:700;padding:12px;margin:0;border-bottom:1px solid #f1f5f9}
.ds-prop{padding:8px 12px;border-bottom:1px solid #f1f5f9}
.ds-prop label{font-size:10px;color:#94a3b8;display:block;margin-bottom:2px}
.ds-prop input[type=range]{width:100%;accent-color:#3b82f6;margin:2px 0}
.ds-prop input[type=color]{width:28px;height:22px;border:none;border-radius:3px;cursor:pointer;padding:0}
.ds-prop select{width:100%;font-size:11px;border:1px solid #cbd5e1;border-radius:4px;padding:2px 4px}
.ds-prop .row{display:flex;align-items:center;gap:6px;margin:2px 0}
.ds-prop .val{font-size:9px;color:#94a3b8}
.ds-el-list{margin:4px 0}
.ds-el-list .el-row{display:flex;align-items:center;gap:6px;padding:3px 12px;cursor:pointer;font-size:11px;color:#475569;border-left:3px solid transparent;transition:all .1s}
.ds-el-list .el-row:hover{background:#f8fafc}
.ds-el-list .el-row.sel{background:#eff6ff;border-left-color:#3b82f6;color:#1e40af}
.ds-el-list .el-row .dot{width:6px;height:6px;border-radius:50%}
.ds-toolbar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid #f1f5f9;background:#fafbfc}
.ds-toolbar button{flex:1;padding:8px;border:none;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600}
.ds-toolbar .save-btn{background:#3b82f6;color:#fff}
.ds-toolbar .save-btn:hover{background:#2563eb}
.ds-toolbar .save-btn:disabled{opacity:.4}
.ds-toolbar .reset-btn{background:#f1f5f9;color:#475569}
.ds-mode-tabs{display:flex;border-bottom:1px solid #e2e8f0;background:#fafbfc}
.ds-mtab{flex:1;padding:8px 4px;border:none;background:none;font-size:12px;font-family:inherit;cursor:pointer;color:#64748b;border-bottom:2px solid transparent;font-weight:600;transition:all .1s}
.ds-mtab.active{color:#3b82f6;border-bottom-color:#3b82f6;background:#eff6ff}
.ds-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.ds-toast.show{opacity:1}
@media(max-width:900px){.ds-panel2{width:240px}}
.lib-card .shape-layer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:0;text-overflow:clip}
.lib-card .card-clip{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:2}
.lib-card .cv{z-index:2}
.lib-card .card-clip{z-index:0}
.lib-card .shape-layer>*{pointer-events:auto}
.lib-card .card-clip>*{pointer-events:auto}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes scrollX{0%{transform:translateX(0)}100%{transform:translateX(var(--marquee-step,-100px))}}
.lib-card .na,.lib-card .ar{overflow:hidden;max-width:100%;text-overflow:clip}

var _assetCache=null,_blobUrls={};
function openAssetCache(){
 if(_assetCache)return Promise.resolve(_assetCache);
 if(!('caches' in window))return Promise.reject('no-caches');
 return caches.open('songbot-assets-v1').then(function(c){_assetCache=c;return c});
}
function loadAsset(url,onDone){
 if(!url)return;
 if(_blobUrls[url]){onDone(_blobUrls[url]);return}
 openAssetCache().then(function(cache){
  return cache.match(url).then(function(hit){
   return hit||fetch(url,{referrerPolicy:'no-referrer'}).then(function(r){
    if(r.ok)cache.put(url,r.clone());
    return r;
   });
  }).then(function(r){return r.blob()}).then(function(b){
   var bu=URL.createObjectURL(b);_blobUrls[url]=bu;onDone(bu);
  });
 }).catch(function(){onDone(url)});
}

		function handleShapeProp(sid,val){
			var m=sid.match(/^shape_(.+)_(\d+)$/);if(!m)return;
			// Handle vertex sub-properties: shape_vx_0_1
			var m2=sid.match(/^shape_v([xy])_(\d+)_(\d+)$/);
			if(m2){
				var si=parseInt(m2[2]),vi=parseInt(m2[3]);
				if(_ds.shapes[si]&&_ds.shapes[si].vertices&&_ds.shapes[si].vertices[vi]){
					_ds.shapes[si].vertices[vi][m2[1]]=val/100;
				}
				return;
			}
			var key=m[1],idx=parseInt(m[2]);if(!_ds.shapes[idx])return;
			var sh=_ds.shapes[idx];
			if(key==="opacity")sh[key]=val/100;
			else if(key==="x"||key==="y"||key==="w"||key==="h"||key==="z"||key==="radius")sh[key]=key==="w"||key==="h"?Math.max(1,parseInt(val)||0):parseInt(val)||0;
			else sh[key]=val;
			if(key==="type"&&val==="circle"){sh.h=sh.w;sh.vertices=[]}
			if(key==="type"&&val==="polygon"&&(!sh.vertices||sh.vertices.length<3)){sh.vertices=[{x:0,y:0},{x:1,y:0},{x:0.5,y:1}]}
			if(key==="type"&&val!=="polygon")sh.vertices=[];

			// 小窗边界
			props.querySelectorAll('[data-sid^="pp_"]').forEach(function(el){
				el.addEventListener('input',function(){
					var k=this.dataset.sid.replace('pp_','');
					_dsPopup[k]=parseInt(this.value)||0;
				})
			});
		}

			props.querySelectorAll('input[type=color]').forEach(function(el){
				if(el.dataset.ppath)el.addEventListener('input',function(){ppSet(this.dataset.ppath,this.value);buildPopupPreview()});
				else if(el.dataset.sid)el.addEventListener('input',function(){handlePShProp(this.dataset.sid,this.value);buildPopupPreview()});
			});
			props.querySelectorAll('input[type=checkbox]').forEach(function(el){
				if(el.dataset.ppath)el.addEventListener('change',function(){ppSet(this.dataset.ppath,this.checked);buildPopupPreview()});
			});
			props.querySelectorAll('select').forEach(function(el){
				if(el.dataset.ppath)el.addEventListener('change',function(){ppSet(this.dataset.ppath,this.value);buildPopupPreview()});
				else if(el.dataset.sid)el.addEventListener('change',function(){handlePShProp(this.dataset.sid,this.value);buildPopupPreview()});
			});
		}

		function handlePShProp(sid,val){
			var m=sid.match(/^psh_(.+)_(\d+)$/);if(!m)return;
			var key=m[1],idx=parseInt(m[2]),sh=_dsPopup.shapes[idx];if(!sh)return;
			if(key==='z')key='zIndex';
			if(key==='opacity')sh[key]=val/100;
			else if(key==='type'){sh[key]=val;if(val==='circle')sh.h=sh.w}
			else sh[key]=typeof val==='string'?val:(parseInt(val)||0);
		}

		// ======== 筛选胶囊可视化设计器 ========
		var _dsFSel='general';
		function ffGet(path){var a=path.split('.');var o=_dsFilters;for(var i=1;i<a.length;i++){if(o==null)return'';o=o[a[i]]}return o===undefined?'':o}
		function ffSet(path,v){var a=path.split('.');var o=_dsFilters;for(var i=1;i<a.length-1;i++){if(o==null)return;o=o[a[i]]}o[a[a.length-1]]=v}
		function ffPr2(lbl,id,type,mn,mx,step){
			var v=ffGet(id),vid='ffv_'+id.replace(/\./g,'_');
			if(type==='color')return'<div class="ds-prop"><div class="row"><label style="flex:1">'+lbl+'</label><input type="color" data-fpath="'+id+'" value="'+v+'"></div></div>';
			if(type==='text')return'<div class="ds-prop"><label>'+lbl+'</label><input type="text" data-fpath="'+id+'" value="'+String(v).replace(/"/g,'&quot;')+'" style="width:100%;font-size:11px;border:1px solid #cbd5e1;border-radius:4px;padding:2px 4px"></div>';
			if(type==='font'){var h="<div class='ds-prop'><label>"+lbl+"</label><select data-fpath='"+id+"'><option value='默认'"+(v==='默认'?' selected':'')+">默认</option>";_dsFonts.forEach(function(f){h+="<option value='"+f.name+"'"+(v===f.name?' selected':'')+">"+f.name+"</option>"});return h+"</select></div>"}
			var st=step||1;var disp=(st<1&&(v%1!==0))?v:Math.round(v);
			return'<div class="ds-prop"><label>'+lbl+' <span class="val" id="'+vid+'">'+disp+'</span></label><input type="range" data-fpath="'+id+'" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+v+'"></div>'
		}
		function buildFiltersPreview(){
			document.getElementById('dsCard').style.display='none';
			document.getElementById('dsPCard').style.display='none';
			var el=document.getElementById('dsFCard');el.style.display='flex';el.style.cssText='display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px;max-width:96vw;margin:0 auto';
			var f=_dsFilters,ff=f.font==='默认'?"'Microsoft YaHei',sans-serif":"'"+f.font+"','Microsoft YaHei',sans-serif";
			var stroke=f.strokeWidth>0?';-webkit-text-stroke:'+f.strokeWidth+'px '+f.strokeColor+';paint-order:stroke fill':'';
			var labels={ALL:'ALL','4K':'4键','5K':'5键','6K':'6键',Catch:'Catch'};
			var html='<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">';
			['ALL','4K','5K','6K','Catch'].forEach(function(k){
				var c=f.capsules[k],isActive=(_dsFSel===k);
				var bg=isActive?'linear-gradient(90deg,'+c.gradLeft+','+c.gradRight+')':_unselectedBgCss();
				var color=isActive?(c.selectedColor||'#fff'):(c.unselectedColor||'#64748b');
				var shadow=isActive?'0 4px 14px '+c.gradLeft+'66,inset 0 1px 0 rgba(255,255,255,0.3)':'inset 0 0 0 1px rgba(203,213,225,0.6),0 1px 3px rgba(0,0,0,0.04)';
				var st=(isActive&&f.strokeWidth>0)?stroke:'';
				html+='<div data-fsel="'+k+'" style="font-family:'+ff+';font-size:'+f.fontSize+'px;font-weight:600;letter-spacing:.5px;width:'+f.capsuleWidth+'px;height:'+f.capsuleHeight+'px;overflow:hidden;box-sizing:border-box;border-radius:'+f.borderRadius+'px;color:'+color+';background:'+bg+';box-shadow:'+shadow+';cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transform:'+(isActive?'translateY(-1px)':'none')+st+'"><span style="display:inline-block;transform:scaleX('+(f.fontScaleX||1)+')">'+labels[k]+'</span></div>';
			});
			html+='</div><div style="color:#94a3b8;font-size:12px;text-align:center">点击胶囊切换选中态预览（蓝框为当前选中编辑项）</div>';
			el.innerHTML=html;
			el.querySelectorAll('[data-fsel]').forEach(function(c){c.addEventListener('click',function(){_dsFSel=this.dataset.fsel;buildFiltersPreview();buildFiltersElList();buildFiltersProps()})});
		}
		function buildFiltersElList(){
			var sel=_dsFSel,f=_dsFilters;
			function row(id,lbl,dot){return'<div class="el-row'+(sel===id?' sel':'')+'" data-fel="'+id+'"><div class="dot" style="'+dot+'"></div> '+lbl+'</div>'}
			function grad(k){var c=f.capsules[k];return'background:linear-gradient(90deg,'+c.gradLeft+','+c.gradRight+')'}
			var h=row('general','通用样式','background:#3b82f6')
				+row('ALL','ALL',grad('ALL'))
				+row('4K','4键',grad('4K'))
				+row('5K','5键',grad('5K'))
				+row('6K','6键',grad('6K'))
				+row('Catch','Catch',grad('Catch'));
			document.getElementById('dsElList').innerHTML=h;
			document.querySelectorAll('#dsElList [data-fel]').forEach(function(r){r.addEventListener('click',function(){_dsFSel=this.dataset.fel;buildFiltersPreview();buildFiltersElList();buildFiltersProps()})});
		}
		function buildFiltersProps(){
			var props=document.getElementById('dsProps'),sel=_dsFSel,f=_dsFilters;
			if(sel==='general'||!sel){
				props.innerHTML='<h3>通用样式</h3>'
					+ffPr2('字体','filters.font','font')
					+ffPr2('字号','filters.fontSize','range',8,48)
					+ffPr2('字体瘦身','filters.fontScaleX','range',0.7,1,0.05)
					+ffPr2('胶囊宽度','filters.capsuleWidth','range',60,200)
					+ffPr2('胶囊高度','filters.capsuleHeight','range',24,80)
					+ffPr2('圆角','filters.borderRadius','range',0,100)
					+'<div class="ds-prop"><label style="font-size:10px;color:#94a3b8;padding:4px 0">未选中背景</label></div>'
					+ffPr2('颜色','filters.unselectedBgColor','color')
					+ffPr2('透明度','filters.unselectedBgOpacity','range',0,100)
					+'<div class="ds-prop"><label style="font-size:10px;color:#94a3b8;padding:4px 0">文字描边</label></div>'
					+ffPr2('描边色','filters.strokeColor','color')
					+ffPr2('描边粗度','filters.strokeWidth','range',0,5,0.1);
			}else{
				var labels={ALL:'ALL','4K':'4键','5K':'5键','6K':'6键',Catch:'Catch'};
				var c=f.capsules[sel];if(!c){sel='general';return buildFiltersProps()}
				props.innerHTML='<h3>'+labels[sel]+' 胶囊</h3>'
					+'<div class="ds-prop"><label style="font-size:10px;color:#94a3b8">渐变（左→右）</label></div>'
					+ffPr2('左端色','filters.capsules.'+sel+'.gradLeft','color')
					+ffPr2('右端色','filters.capsules.'+sel+'.gradRight','color')
					+'<div class="ds-prop"><label style="font-size:10px;color:#94a3b8;padding:4px 0">文字颜色</label></div>'
					+ffPr2('未选中字色','filters.capsules.'+sel+'.unselectedColor','color')
					+ffPr2('选中字色','filters.capsules.'+sel+'.selectedColor','color');
			}
			var fn=f.font;if(fn&&fn!=='默认')loadFont(fn);
			bindFiltersPropEvents();
		}
		function bindFiltersPropEvents(){
			var props=document.getElementById('dsProps');
			props.querySelectorAll('input[type=range]').forEach(function(el){
				var fp=el.dataset.fpath;if(!fp)return;
				var vid=document.getElementById('ffv_'+fp.replace(/\./g,'_'));if(vid)vid.textContent=ffGet(fp);
				el.addEventListener('input',function(){ffSet(fp,parseFloat(this.value));if(vid)vid.textContent=this.value;buildFiltersPreview();applyFiltersCSS()});
			});
			props.querySelectorAll('input[type=color]').forEach(function(el){
				var fp=el.dataset.fpath;if(!fp)return;
				el.addEventListener('input',function(){ffSet(fp,this.value);buildFiltersPreview();buildFiltersElList();applyFiltersCSS()});
			});
			props.querySelectorAll('select').forEach(function(el){
				var fp=el.dataset.fpath;if(!fp)return;
				el.addEventListener('change',function(){ffSet(fp,this.value);buildFiltersPreview();applyFiltersCSS()});
			});
			props.querySelectorAll('input[type=text]').forEach(function(el){
				var fp=el.dataset.fpath;if(!fp)return;
				el.addEventListener('input',function(){ffSet(fp,this.value);buildFiltersPreview();applyFiltersCSS()});
			});
		}

		(function(){
			var cb=document.getElementById('dsModeCard'),pb=document.getElementById('dsModePopup'),fb=document.getElementById('dsModeFilter');
			if(!cb||!pb)return;
			function showCard(){cb.classList.add('active');pb.classList.remove('active');if(fb)fb.classList.remove('active');document.getElementById('dsPCard').style.display='none';document.getElementById('dsFCard').style.display='none';document.getElementById('dsCard').style.display='';_dsSel=null;buildPreview();buildElList();buildProps()}
			function showPopup(){pb.classList.add('active');cb.classList.remove('active');if(fb)fb.classList.remove('active');document.getElementById('dsFCard').style.display='none';document.getElementById('dsCard').style.display='none';buildPopupPreview();buildPopupElList();buildPopupProps()}
			function showFilter(){if(!fb)return;fb.classList.add('active');cb.classList.remove('active');pb.classList.remove('active');document.getElementById('dsPCard').style.display='none';document.getElementById('dsCard').style.display='none';buildFiltersPreview();buildFiltersElList();buildFiltersProps()}
			cb.addEventListener('click',function(){if(_dsMode==='card')return;_dsMode='card';showCard()});
			pb.addEventListener('click',function(){if(_dsMode==='popup')return;_dsMode='popup';showPopup()});
			if(fb)fb.addEventListener('click',function(){if(_dsMode==='filters')return;_dsMode='filters';showFilter()});
		})();
	})();






// ==================== 网站编辑器 ====================
(function(){
var BLOG_API=API_BASE+'/api/blog';
var _currentFile=null;

function weToast(msg){
	var t=document.getElementById('weToast');
	t.textContent=msg;t.classList.add('show');
	setTimeout(function(){t.classList.remove('show')},2000);
}

window.openWebsiteEditor=function(){
	if(!_isAdmin){toast('需要管理员权限');return}
	document.getElementById('weOverlay').classList.add('show');
	syncPosts();
};

window.closeWebsiteEditor=function(){
	document.getElementById('weOverlay').classList.remove('show');
	_currentFile=null;
	document.getElementById('weEditor').value='';
	document.getElementById('weEditor').style.display='none';
	document.getElementById('weEditorToolbar').style.display='none';
	document.getElementById('weEditorEmpty').style.display='';
	document.getElementById('weFileName').textContent='—';
};

window.syncPosts=function(){
	var list=document.getElementById('weFileList');
	list.innerHTML='<div class="we-empty-state">加载中...</div>';
	fetch(BLOG_API+'/list')
		.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
		.then(function(files){
			if(!Array.isArray(files)){list.innerHTML='<div class="we-empty-state">无数据</div>';return}
			if(files.length===0){list.innerHTML='<div class="we-empty-state">暂无 .md 文件</div>';return}
			list.innerHTML='';
			files.forEach(function(f){
				var fname=f.name||f;
				var div=document.createElement('div');
				div.className='we-file-item';
				div.textContent=fname;
				div.addEventListener('click',function(){openMdFile(fname)});
				list.appendChild(div);
			});
		})
		.catch(function(e){list.innerHTML='<div class="we-empty-state" style="color:#ef4444">加载失败: '+escHtml(e.message)+'</div>'});
};

function openMdFile(filename){
	_currentFile=filename;
	document.getElementById('weFileName').textContent=filename;
	document.getElementById('weEditorEmpty').style.display='none';
	document.getElementById('weEditor').style.display='';
	document.getElementById('weEditorToolbar').style.display='';
	document.getElementById('weEditor').value='加载中...';
	document.getElementById('weEditor').disabled=true;
	document.querySelectorAll('.we-file-item').forEach(function(el){el.classList.remove('active')});
	var items=document.querySelectorAll('.we-file-item');
	items.forEach(function(el){if(el.textContent===filename)el.classList.add('active')});

	fetch(BLOG_API+'/read?'+encodeURIComponent(filename))
		.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
		.then(function(d){
			document.getElementById('weEditor').value=d.content||'';
			document.getElementById('weEditor').disabled=false;
			document.getElementById('weEditor').focus();
		})
		.catch(function(e){
			document.getElementById('weEditor').value='// 加载失败: '+e.message;
			document.getElementById('weEditor').disabled=false;
		});
}

window.saveCurrentMd=function(){
	if(!_currentFile){weToast('请先选择文件');return}
	var content=document.getElementById('weEditor').value;
	var btn=document.getElementById('weSaveBtn');
	btn.disabled=true;btn.textContent='保存中...';
	fetch(BLOG_API+'/save',{
		method:'POST',
		headers:{'Content-Type':'application/json'},
		body:JSON.stringify({name:_currentFile,content:content})
	})
	.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
	.then(function(){weToast('已保存: '+_currentFile);btn.disabled=false;btn.textContent='保存到服务器'})
	.catch(function(e){weToast('保存失败: '+e.message);btn.disabled=false;btn.textContent='保存到服务器'});
};

window.downloadCurrentMd=function(){
	if(!_currentFile){weToast('请先选择文件');return}
	var content=document.getElementById('weEditor').value;
	var blob=new Blob([content],{type:'text/markdown;charset=utf-8'});
	var url=URL.createObjectURL(blob);
	var a=document.createElement('a');a.href=url;a.download=_currentFile;
	document.body.appendChild(a);a.click();a.remove();
	URL.revokeObjectURL(url);
};


window.uploadNewMd=function(){
	document.getElementById('weFileInput').click();
};

window.handleMdUpload=function(input){
	var file=input.files[0];if(!file)return;
	if(!file.name.toLowerCase().endsWith('.md')){weToast('只允许上传 .md 文件');input.value='';return}
	if(file.size>5*1024*1024){weToast('文件不能超过 5MB');input.value='';return}
	var reader=new FileReader();
	reader.onload=function(){
		var content=reader.result;
		fetch(BLOG_API+'/save',{
			method:'POST',
			headers:{'Content-Type':'application/json'},
			body:JSON.stringify({name:file.name,content:content})
		})
		.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
		.then(function(){weToast('已上传: '+file.name);syncPosts()})
		.catch(function(e){weToast('上传失败: '+e.message)});
	};
	reader.readAsText(file,'utf-8');
	input.value='';
};

// 点击遮罩关闭
document.getElementById('weOverlay').addEventListener('click',function(e){if(e.target===this)closeWebsiteEditor()});
})();


})();
</script>
</body>
