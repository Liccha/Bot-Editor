<html lang="zh-CN">
<head>

<title>Bot 工作站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Microsoft YaHei',sans-serif;background:#f5f6fa url('bg.png') center/cover fixed}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;gap:0}
.tab-bar button{padding:12px 24px;border:none;background:none;font-size:14px;font-family:inherit;cursor:pointer;color:#64748b;border-bottom:2px solid transparent;transition:all .15s}
.tab-bar button:hover{color:#1e293b}
.tab-bar button.active{color:#3b82f6;border-bottom-color:#3b82f6;font-weight:600}
.tab-content{display:none;height:calc(100% - 49px);overflow-y:auto}
.tab-content.active{display:flex;flex-direction:column}
/* --- 公告编辑器样式 --- */
.a-app{width:100%;max-width:960px;display:flex;flex-direction:column;min-height:100%;padding:24px 20px;margin:0 auto}
.a-app h1{text-align:center;color:#1e293b;font-size:22px;margin-bottom:20px;letter-spacing:1px}
.a-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;flex:1}
.a-card{background:rgba(255,255,255,0.75);border-radius:14px;border:1px solid #e1e4eb;padding:12px 10px;text-align:center;cursor:pointer;transition:all .15s;min-height:155px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.a-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
.a-card .grp{font-weight:700;font-size:13px;color:#1e293b;margin-bottom:4px}
.a-card .tm{font-size:11px;color:#64748b;margin-bottom:2px}
.a-card .st{font-size:11px;margin-bottom:4px}
.a-card .st.sent{color:#16a34a;font-weight:600}
.a-card .st.pending{color:#d97706;font-weight:600}
.a-card .cnt{font-size:11px;color:#475569;line-height:1.4;word-break:break-all;max-height:50px;overflow:hidden}
.a-card .del{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;border:none;background:#f1f5f9;color:#94a3b8;cursor:pointer;font-size:14px;line-height:20px;display:none;transition:all .15s}
.a-card:hover .del{display:block}
.a-card .del:hover{background:#fecaca;color:#dc2626}
.a-card.add{border:2px dashed #cbd5e1;background:#f8fafc}
.a-card.add:hover{background:#e2e8f0;border-color:#94a3b8}
.a-card.add .plus{font-size:36px;color:#94a3b8;font-weight:200}
.a-card-ghost{visibility:hidden}
.a-pager{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 0 8px}
.a-pager button{padding:7px 22px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1e293b;cursor:pointer;font-size:13px;font-family:inherit}
.a-pager button:disabled{opacity:.35;cursor:default}
.a-pager span{font-size:13px;color:#64748b}
/* --- Shared --- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border-radius:10px;border:none;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
.btn.primary{background:#3b82f6;color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.3)}
.btn.primary:hover{background:#2563eb}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.secondary{background:#fff;color:#475569;border:1px solid #cbd5e1}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.4);z-index:1000;justify-content:center;align-items:flex-start;padding-top:32px;overflow-y:auto}
.overlay.show{display:flex}
.dialog{background:#fff;border-radius:18px;padding:24px 28px;width:540px;max-width:96vw;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.dialog h2{font-size:17px;color:#1e293b;margin-bottom:18px;font-weight:700}
.sec{margin-bottom:15px}
.sec label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:6px}
.sec textarea{width:100%;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;min-height:200px;outline:none}
.sec textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.sec input[type=text]{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.sec .gid-wrap{display:flex}.sec .gid-wrap input{flex:1;border-radius:10px 0 0 10px}
.sec .gid-wrap .dd-btn{width:36px;background:#fff;border:1px solid #cbd5e1;border-left:none;border-radius:0 10px 10px 0;cursor:pointer;font-size:12px;color:#64748b;display:flex;align-items:center;justify-content:center}
.dd-menu{display:none;position:absolute;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:2000;min-width:210px}
.dd-menu.show{display:block}
.dd-menu .dd-item{padding:9px 16px;font-size:13px;cursor:pointer;color:#1e293b;border-bottom:1px solid #f1f5f9}
.dd-menu .dd-item:hover{background:#eff6ff}
.file-zone{border:2px dashed #cbd5e1;border-radius:10px;padding:42px 14px;text-align:center;color:#94a3b8;font-size:12px;cursor:pointer}
.file-zone:hover,.file-zone.drag{border-color:#3b82f6;color:#3b82f6;background:#eff6ff}
.attach-list{list-style:none;margin-top:8px}.attach-list li{font-size:12px;color:#475569;padding:3px 0;cursor:pointer}
.attach-list li:hover{color:#ef4444}.attach-list li:after{content:' ×';color:#94a3b8;font-size:10px}
.chk-row{display:flex;gap:24px}.chk-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:#1e293b;cursor:pointer}
.calendar{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);padding:16px;z-index:3000;width:290px;border:1px solid #e2e8f0}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-nav button{border:none;background:#f1f5f9;cursor:pointer;font-size:13px;color:#475569;padding:3px 10px;border-radius:6px}
.cal-nav span{font-size:14px;font-weight:700;color:#1e293b}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .wh{font-size:10px;color:#94a3b8;padding:5px 0;font-weight:600}
.cal-grid .wh.wk{color:#ef4444}
.cal-grid .day{font-size:13px;padding:7px 0;border-radius:7px;cursor:pointer;color:#334155}
.cal-grid .day:hover{background:#eff6ff}
.cal-grid .day.off{color:#cbd5e1;pointer-events:none}
.cal-grid .day.today{background:#dbeafe;color:#1e40af;font-weight:600}
.cal-grid .day.sel{background:#3b82f6;color:#fff;font-weight:600}
.cal-time{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:13px;color:#475569}
.btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-row .btn{padding:8px 24px;border-radius:10px;border:none;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600}
.tpl-capsule{display:inline-block;padding:3px 12px;border-radius:12px;font-size:11px;cursor:pointer;border:1px solid #cbd5e1;background:#f8fafc;color:#475569;transition:all .15s}
.tpl-capsule:hover{background:#3b82f6;color:#fff;border-color:#3b82f6}
.tpl-capsule.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 28px;border-radius:24px;font-size:13px;z-index:4000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:900px){.a-grid{grid-template-columns:repeat(4,1fr)}.a-card{min-height:140px}}
@media(max-width:700px){.a-grid{grid-template-columns:repeat(3,1fr)}.a-card{min-height:130px}}
@media(max-width:480px){.a-grid{grid-template-columns:repeat(2,1fr);gap:8px}.a-card{min-height:120px;padding:8px 6px}.a-card .grp{font-size:12px}.a-card .cnt{font-size:10px}.cal-grid .day{font-size:11px;padding:5px 0}}

/* --- 曲库查询 --- */
.lib-search{width:100%;max-width:600px;padding:10px 16px;border:2px solid #cbd5e1;border-radius:12px;font-size:14px;font-family:inherit;outline:none;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto}
.lib-search:focus{border-color:#3b82f6}
.lib-grid{display:flex;flex-direction:column;gap:8px}
.lib-card{background:rgba(255,255,255,0.85);border-radius:12px;border:1px solid #e2e8f0;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:all .15s}
.lib-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.lib-card img{width:80px;height:80px;object-fit:cover;border-radius:8px;flex-shrink:0}
.lib-card .li{flex:1;min-width:0}
.lib-card .li .ln{font-weight:700;font-size:13px;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-card .li .la{font-size:11px;color:#64748b}
.lib-card .li .lc{font-size:10px;color:#94a3b8;margin-top:2px}
.lib-card .li .ld{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.lib-card .li .ld span{padding:1px 6px;border-radius:6px;font-size:9px;font-weight:600}
.lib-stats{text-align:center;color:#64748b;font-size:13px;margin-bottom:12px}
.lib-detail{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.5);z-index:1000;justify-content:center;align-items:flex-start;padding-top:32px;overflow-y:auto}
.lib-detail.show{display:flex}
.lib-detail .dd{background:#fff;border-radius:16px;padding:24px;width:500px;max-width:96vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.lib-detail img{width:120px;height:120px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.lib-detail h3{font-size:18px;color:#1e293b;margin-bottom:4px}
.lib-detail .da{font-size:13px;color:#64748b;margin-bottom:8px}
.lib-detail audio{width:100%;height:32px;margin-top:8px}
}
</style>

// files
var _session='';
function uploadFile(file,onDone,onProgress,ftype){
 var xhr=new XMLHttpRequest();
 xhr.open('POST',UPLOAD_API);
 xhr.setRequestHeader('X-Filename',encodeURIComponent(file.name));
 xhr.setRequestHeader('X-Session',_session);
 xhr.setRequestHeader('X-Type',ftype||'attach');
 xhr.upload.onprogress=function(e){if(e.lengthComputable&&onProgress)onProgress(Math.round(e.loaded*100/e.total))};
 xhr.onload=function(){if(xhr.status===200){try{var j=JSON.parse(xhr.responseText);onDone(j.token)}catch(ex){onDone(null)}}else{onDone(null)}};
 xhr.onerror=function(){onDone(null)};
 xhr.send(file);
 if(onProgress)onProgress(0);
 return xhr;
}
var fz=document.getElementById('fileZone');
fz.addEventListener('click',function(){var i=document.createElement('input');i.type='file';i.multiple=true;i.style.display='none';document.body.appendChild(i);i.onchange=function(){addFiles(i.files);document.body.removeChild(i)};i.click()});
fz.addEventListener('dragover',function(e){e.preventDefault();fz.classList.add('drag')});
fz.addEventListener('dragleave',function(){fz.classList.remove('drag')});
fz.addEventListener('drop',function(e){e.preventDefault();fz.classList.remove('drag');addFiles(e.dataTransfer.files)});
function addFiles(fl){for(var i=0;i<fl.length;i++){(function(f){var item={name:f.name,xhr:true,progress:0};_files.push(item);item.xhr=uploadFile(f,function(token){if(token){item.token=token;item.progress=100;item.xhr=null}else{item.error=true;item.xhr=null}renderAttach()},function(p){item.progress=p;renderAttach()},'attach');renderAttach()})(fl[i])}}
function renderAttach(){var u=document.getElementById('attachList');u.innerHTML='';_files.forEach(function(f,i){var li=document.createElement('li');var bar=f.xhr?'<progress value="'+f.progress+'" max="100" style="width:50px;height:6px;vertical-align:middle;margin-right:4px;accent-color:#3b82f6"></progress> '+f.progress+'%':'';li.innerHTML=(f.error?'❌ ':'')+escHtml(f.name)+' '+bar;li.onclick=function(){if(f.xhr&&f.xhr.abort){f.xhr.abort();f.xhr=null}if(f.token){var fn=f.token.split('/').pop();fetch(UPLOAD_API,{method:'DELETE',headers:{'X-Session':_session,'X-Filename':encodeURIComponent(fn||f.name)}})}_files.splice(i,1);renderAttach()};if(f.error)li.style.color='#ef4444';else if(f.xhr)li.style.color='#3b82f6';u.appendChild(li)})}
document.getElementById('fImage').addEventListener('change',function(){var f=this.files[0];if(!f)return;if(f.size>=2*1024*1024){toast('图片不能超过 2 MB！');this.value='';return}document.getElementById('imgName').innerHTML='<progress value="0" max="100" style="width:60px;height:6px;accent-color:#3b82f6;vertical-align:middle;margin-right:4px"></progress>0%';document.getElementById('imgName').style.color='#3b82f6';_imgXhr=uploadFile(f,function(token){_imgData=token;_imgXhr=null;document.getElementById('imgName').innerHTML=f.name;document.getElementById('imgName').style.color='#22c55e'},function(p){document.getElementById('imgName').innerHTML='<progress value="'+p+'" max="100" style="width:60px;height:6px;accent-color:#3b82f6;vertical-align:middle;margin-right:4px"></progress>'+p+'%'},'image');});
// API
async function loadData(){var st=document.getElementById('apiStatus');try{st.textContent='⏳ 加载中...';st.style.color='#94a3b8';var r=await fetch(API);if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();if(!Array.isArray(data)){data=[];throw new Error('非数组')}data.sort(function(a,b){return(a.time||'').localeCompare(b.time||'')});st.textContent='✓ '+data.length+' 条公告';st.style.color='#22c55e'}catch(e){data=[];st.textContent='✗ '+e.message;st.style.color='#ef4444'}renderCards()}
async function saveData(arr){try{var r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(arr)});if(r.ok){data=JSON.parse(JSON.stringify(arr));return true}}catch(e){}return false}
// cards
function renderCards(){var g=document.getElementById('grid'),tp=Math.max(1,Math.ceil((data.length+1)/A_SLOTS));if(page>=tp)page=tp-1;var s=page*A_SLOTS,html='',plusPlaced=false;for(var i=0;i<A_SLOTS;i++){var idx=s+i;if(idx<data.length){var a=data[idx],gr=mapGrp(a.groupId||'?'),cnt=(a.content||'').replace(/\\n/g,' ');if(cnt.length>18)cnt=cnt.slice(0,18)+'...';var st=a.sent==='true'?'<span class="st sent">已发送</span>':'<span class="st pending">待发送</span>';html+='<div class="a-card" data-idx="'+idx+'"><div class="del" data-del="'+idx+'">×</div><div class="grp">'+escHtml(gr)+'</div><div class="tm">'+(a.time||'?')+'</div>'+st+'<div class="cnt">'+escHtml(cnt)+'</div></div>'}else if(!plusPlaced){html+='<div class="a-card add" id="addCard"><div class="plus">+</div></div>';plusPlaced=true}else{html+='<div class="a-card a-card-ghost"></div>'}}g.innerHTML=html;var ac=document.getElementById('addCard');if(ac)ac.addEventListener('click',function(){page=tp-1;openEditor(-1)});var cards=g.querySelectorAll('.a-card[data-idx]');for(var j=0;j<cards.length;j++){(function(idx){cards[j].addEventListener('click',function(e){if(!e.target.classList.contains('del'))openEditor(idx)})})(+cards[j].dataset.idx)}var dels=g.querySelectorAll('.del[data-del]');for(var k=0;k<dels.length;k++){(function(idx){dels[k].addEventListener('click',function(e){e.stopPropagation();var a=data[idx],sess='';if(a.attach){var m=a.attach.match(/^([^|]+)\//);if(m)sess=m[1]}if(!sess&&a.image){var m2=a.image.match(/^([^/]+)\//);if(m2)sess=m2[1]}if(sess)fetch(UPLOAD_API,{method:'DELETE',headers:{'X-Session':sess}});data.splice(idx,1);saveData(data).then(function(){renderCards()})})})(+dels[k].dataset.del)}var pg=document.getElementById('pager');pg.innerHTML='';var pb=document.createElement('button');pb.textContent='← 上一页';if(page>0)pb.addEventListener('click',function(){page--;renderCards()});else pb.disabled=true;var nb=document.createElement('button');nb.textContent='下一页 →';if((page+1)*A_SLOTS<=data.length)nb.addEventListener('click',function(){page++;renderCards()});else nb.disabled=true;var sp=document.createElement('span');sp.textContent='第 '+(page+1)+'/'+tp+' 页 ('+data.length+' 个公告)';pg.appendChild(pb);pg.appendChild(sp);pg.appendChild(nb)}
function openEditor(idx){editIdx=idx;editExisting=idx>=0?data[idx]:null;// 复用已有 session 或新建
var existSession='';if(editExisting&&editExisting.attach){var m=editExisting.attach.match(/^([^|]+)\//);if(m)existSession=m[1]}
if(editExisting&&editExisting.image){var m2=editExisting.image.match(/^([^/]+)\//);if(m2)existSession=m2[1]}
_session=existSession||('ann_'+Date.now());_imgData=null;_imgXhr=null;document.getElementById('dlgTitle').textContent=idx>=0?'编辑公告':'新建公告';document.getElementById('fContent').value=editExisting?(editExisting.content||'').replace(/\\n/g,'\n'):'';var dt=(editExisting&&editExisting.time)?editExisting.time:fmt(nowDate());document.getElementById('fTime').value=dt;var gid=editExisting?editExisting.groupId||'858973074':'858973074';document.getElementById('fGroup').value=(gid==='****')?'****':gid;document.getElementById('fPin').checked=editExisting&&editExisting.pin==='true';document.getElementById('fConfirm').checked=editExisting&&editExisting.confirm==='true';document.getElementById('fImage').value='';if(editExisting&&editExisting.image){_imgData=editExisting.image;var imgDisp=editExisting.image.replace(/^.*\//,'');document.getElementById('imgName').textContent=imgDisp;document.getElementById('imgName').style.color='#22c55e'}else{_imgData=null;document.getElementById('imgName').textContent='未选择';document.getElementById('imgName').style.color='#94a3b8'}_files=[];if(editExisting&&editExisting.attach){var ps=editExisting.attach.split('|');for(var i=0;i<ps.length;i++){if(ps[i]){var raw=ps[i],nm=raw.replace(/^.*\//,'');_files.push({name:nm,token:raw})}}}renderAttach();document.getElementById('dlgOverlay').classList.add('show')}
var TEMPLATES={album:"【更新公告】专辑《》已开放下载!\n——————————\n内含歌曲：\n",event:"【茶韵Event轮换公告】\n——————————\n▍Event轮换更新预告🔸\n《》将于当前商店活动中专辑结束后限时上架，届时将开启排行榜进行计分。\n▍Event开放时间🔸\nxx/xx 08:00-xx/xx 08:00\n▍专辑曲目🔸\n\n▍活动说明🔸\n此专辑为xx第x期Event，活动成绩参与排名和热度总计。\n",single:"【吼吼点唱机轮换公告】\n————————\n《》→《》\n",cover:"//观影封面\n",position:"//观影定位\n"};document.querySelectorAll(".tpl-capsule").forEach(function(el){el.addEventListener("click",function(){document.getElementById("fContent").value=TEMPLATES[this.dataset.tpl]||""})});
function cancelEditor(){if(_session&&!editExisting){fetch(UPLOAD_API,{method:'DELETE',headers:{'X-Session':_session}})}document.getElementById('dlgOverlay').classList.remove('show')}
document.getElementById('btnCancel').addEventListener('click',cancelEditor);
async function doSave(){var ct=document.getElementById('fContent').value.trim();if(!ct){toast('公告内容不能为空！');return}if(ct.length>600){toast('公告内容不能超过 600 字！当前 '+ct.length+' 字');return}// 等待所有上传完成
var pending=_files.filter(function(f){return f.xhr});if(_imgXhr)pending.push({xhr:_imgXhr});
if(pending.length>0){toast('请等待文件上传完成 ('+pending.length+' 个进行中)...');return}
var entry=editExisting?JSON.parse(JSON.stringify(editExisting)):{};entry.title=ct.split('\n')[0];entry.content=ct;var rawTime=document.getElementById('fTime').value,dt=parseDt(rawTime);entry.time=[dt[0],pad(dt[1]),pad(dt[2])].join('-')+' '+pad(parseInt(dt[3])||0)+':'+pad(parseInt(dt[4])||0);var gid=document.getElementById('fGroup').value.trim();entry.groupId=(gid==='****')?'****':gid;entry.pin=document.getElementById('fPin').checked?'true':'false';entry.confirm=document.getElementById('fConfirm').checked?'true':'false';if(_imgData)entry.image=_imgData;var aps=[];for(var i=0;i<_files.length;i++)aps.push(_files[i].token||_files[i].name);entry.attach=aps.join('|');entry.sent=editExisting?editExisting.sent||'false':'false';if(editIdx<0)data.push(entry);else data[editIdx]=entry;var ok=await saveData(data);if(ok){renderCards();document.getElementById('dlgOverlay').classList.remove('show');toast('保存成功！')}else toast('保存失败！')}
document.getElementById('btnSave').addEventListener('click',doSave);
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('dlgOverlay').classList.remove('show')});
loadData();
})();



// ==================== 曲库查询 ====================
var LIB_DATA=[],_libFilter="ALL";
async function loadLibrary(){
 document.getElementById("libStats").textContent="Loading...";
 try{
  var r=await fetch("https://raw.githubusercontent.com/Liccha/song-library/master/data/songs.json");
  if(!r.ok)throw new Error("HTTP "+r.status);
  LIB_DATA=await r.json();
  LIB_DATA.sort(function(a,b){return b.id-a.id});
  document.getElementById("libStats").textContent=LIB_DATA.length+" songs loaded";
  renderLibrary();
 }catch(e){document.getElementById("libStats").textContent="Failed: "+e.message}
}
function renderLibrary(filter){
 if(!LIB_DATA.length)return;
 var today=new Date();today=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
 var q=(filter||"").toLowerCase(),html="",count=0,hidden=0;
 for(var i=0;i<LIB_DATA.length;i++){
  var s=LIB_DATA[i];
  if(s.albumDate&&s.albumDate>today){hidden++;continue}
  if(_libFilter!=="ALL"){var hasMode=false;(s.charts||[]).forEach(function(c){if(_libFilter==="Catch"){var ok=Object.keys(c).some(function(k){return k!=="mode"&&c[k]&&c[k].isMode3});if(ok)hasMode=true}else{if(c.mode===_libFilter){var ok2=Object.keys(c).some(function(k){return k!=="mode"&&c[k]&&!c[k].isMode3&&(c[k].level>0||c[k].combo>0)});if(ok2)hasMode=true}}});if(!hasMode){hidden++;continue}}
  if(q&&s.name.toLowerCase().indexOf(q)<0&&(s.artist||"").toLowerCase().indexOf(q)<0&&(s.charters||[]).join(" ").toLowerCase().indexOf(q)<0)continue;
  var cov=s.cover||"";
  var tags="";
  (s.charts||[]).forEach(function(c){
   var maxL=0,hasCatch=false;(Object.keys(c)).forEach(function(k){if(k!=="mode"&&c[k]){if(c[k].isMode3)hasCatch=true;else if(c[k].level>maxL)maxL=c[k].level}});
   if(maxL)tags+="<span style=\"background:#dbeafe;color:#1e40af\">"+c.mode+" Lv."+maxL+"</span>";
   if(hasCatch)tags+="<span style=\"background:#fce7f3;color:#9d174d\">"+c.mode+" Catch</span>";
  });
  html+="<div class=\"lib-card\" onclick=\"showSongDetail("+i+")\">"+(cov?"<img src=\""+cov+"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onerror=\"this.style.display=\x27none\x27\">":"")+"<div class=\"li\"><div class=\"ln\">"+escHtml(s.name)+"</div><div class=\"la\">"+escHtml(s.artist||"")+"</div><div class=\"lc\">BPM:"+(s.bpm||"?")+" | "+s.duration+" | "+(s.charters||[]).join(", ")+"</div><div class=\"ld\">"+tags+"</div></div></div>";
  count++;
 }
 document.getElementById("libGrid").innerHTML=html||"<div style=\"text-align:center;color:#94a3b8;padding:40px\">No results</div>";
 var total=LIB_DATA.length-hidden;
 document.getElementById("libStats").textContent=(filter?"Found "+count+"/"+total:total+" songs");
}
document.getElementById("libFilters").addEventListener("click",function(e){if(e.target.dataset.flt){_libFilter=e.target.dataset.flt;document.querySelectorAll("#libFilters span").forEach(function(s){s.classList.remove("active")});e.target.classList.add("active");renderLibrary(document.getElementById("libSearch").value)}});
document.getElementById("libSearch").addEventListener("input",function(){renderLibrary(this.value)});
function showSongDetail(idx){
 var s=LIB_DATA[idx];if(!s)return;
 var c=document.getElementById("libDetailContent");
 var tags="";(s.charts||[]).forEach(function(c2){
  var modes="";Object.keys(c2).forEach(function(k){if(k!=="mode"&&c2[k]){if(c2[k].isMode3)modes+=k.toUpperCase()+":"+c2[k].name+" ";else modes+=k.toUpperCase()+c2[k].level+"("+c2[k].combo+") "}});
  tags+="<span style=\"display:inline-block;margin:2px 3px;padding:4px 10px;border-radius:8px;font-size:11px;background:#f1f5f9;color:#475569\"><b>"+c2.mode+"</b> "+modes+"</span>";
 });
 c.innerHTML=(s.cover?"<img src=\""+s.cover+"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onerror=\"this.style.display=\x27none\x27\">":"")+"<h3>"+escHtml(s.name)+"</h3><div class=\"da\">"+escHtml(s.artist||"")+" | BPM:"+(s.bpm||"?")+" | "+s.duration+" | 谱师:"+(s.charters||[]).join(", ")+"</div><div style=\"margin-bottom:8px\">"+tags+"</div>"+(s.preview?"<audio controls src=\""+s.preview+"\"></audio>":"")+"<div style=\"margin-top:12px;font-size:10px;color:#94a3b8\">Album: "+(s.album||"-")+"</div>";
 document.getElementById("libDetail").classList.add("show");
}
document.getElementById("libDetail").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show")});
})();
</script>
